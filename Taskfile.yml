version: '3'

# Values are passed as environment data, never interpolated into shell code.
# Credentials in .env are read by Python helpers, not imported/echoed by Task.
silent: true
env:
  NEO_BOOTLOADER: '{{.BOOTLOADER | default "../GameShell/Code/Kernel/v0.2/u-boot-sunxi-with-spl.bin"}}'
  NEO_RADIO_DIR: '{{.RADIO_DIR | default ".local/hardware-baseline/2026-09-27/radio-reference"}}'
  NEO_AUTHORIZED_KEY: '{{.AUTHORIZED_KEY | default ".local/ssh/id_ed25519.pub"}}'
  NEO_IMAGE: '{{.IMAGE | default ""}}'
  NEO_ROUTE: '{{.ROUTE | default "wifi"}}'
  NEO_DISK: '{{.DISK | default ""}}'
  NEO_COMMAND: '{{.CLI_ARGS}}'
  NEO_ACTIVE_COUNTRY: '{{.ACTIVE_COUNTRY | default ""}}'
  NEO_USB_CYCLES: '{{.CYCLES | default "4"}}'
  NEO_USB_DETECT_SECONDS: '{{.SECONDS | default "600"}}'
  NEO_BOOT_CYCLES: '{{.CYCLES | default "4"}}'
  NEO_IDLE_SECONDS: '{{.SECONDS | default "600"}}'
  NEO_IDLE_BACKLIGHT: '{{.BACKLIGHT | default "keep"}}'
  NEO_PROFILE_SECONDS: '{{.SECONDS | default "120"}}'
  NEO_CHARGE_SECONDS: '{{.SECONDS | default "120"}}'
  NEO_GOVERNOR_RATE_US: '{{.RATE_US | default "10000"}}'
  NEO_PERF_SECONDS: '{{.SECONDS | default "30"}}'
  NEO_USB_POLL_MODE: '{{.MODE | default "status"}}'
  NEO_USB_DIAG_SECONDS: '{{.SECONDS | default "60"}}'
  NEO_USB_DIAG_ERRORS: '{{.ERRORS | default "1"}}'
  NEO_RSB_SECONDS: '{{.SECONDS | default "120"}}'
  NEO_RSB_DELAY_MS: '{{.DELAY_MS | default "100"}}'
  NEO_PM_STAGE: '{{.STAGE | default ""}}'
  NEO_PM_CYCLES: '{{.CYCLES | default "1"}}'
  NEO_PM_RUN: '{{.RUN | default ""}}'
  NEO_SLEEP_QUALIFICATION: '{{.QUALIFICATION | default ""}}'
  NEO_SLEEP_REHEARSAL: '{{.REHEARSAL | default ""}}'
  NEO_SLEEP_BATCH: '{{.BATCH | default ""}}'
  NEO_SLEEP_ATTENDED: '{{.ATTENDED | default "0"}}'
  NEO_SLEEP_CABLE_OBSERVATION: '{{.OBSERVATION | default ""}}'
  NEO_SLEEP_CABLE_DISPLAY: '{{.DISPLAY | default ""}}'
  NEO_SLEEP_CABLE_ACTION: '{{.CABLE_ACTION | default "0"}}'
  NEO_SLEEP_CABLE_ABSENT: '{{.UNPLUGGED | default "0"}}'
  NEO_SLEEP_RESULT: '{{.RESULT | default ""}}'
  NEO_SLEEP_COLLECT_ROUTE: '{{.ROUTE | default "usb"}}'
  NEO_KEYPAD_TRACE: '{{.KEYPAD_TRACE | default "0"}}'
  NEO_WIFI_TRACE: '{{.WIFI_TRACE | default "0"}}'
  NEO_KEYPAD_AUDIO: '{{.AUDIO | default "0"}}'
  NEO_KEYPAD_QUIRK: '{{.QUIRK | default ""}}'
  NEO_AUDIO_RUN: '{{.RUN | default ""}}'
  NEO_AUDIO_ROUTE: '{{.ROUTE | default "usb"}}'
  NEO_AUDIO_LEVEL: '{{.LEVEL | default "5"}}'
  NEO_CHECKPOINT_NAME: '{{.NAME | default ""}}'
  NEO_SCRATCH_SUITE: '{{.SUITE | default ""}}'
  NEO_SCRATCH_APPLY: '{{.APPLY | default "0"}}'
  NEO_SCRATCH_TARGET: '{{.TARGET | default ""}}'
  NEO_SCRATCH_RECORDED_PATCHES: '{{.RECORDED_PATCHES | default "0"}}'
  NEO_RETENTION_KEEP: '{{.KEEP | default "3"}}'
  NEO_RETENTION_APPLY: '{{.APPLY | default "0"}}'
  NEO_RECOVERY_UPLOAD: '{{.UPLOAD | default "0"}}'
  NEO_USB_POLICY_DTB: '{{.DTB | default ".local/build/kernel/arch/arm/boot/dts/allwinner/sun8i-r16-clockworkpi-cpi3.dtb"}}'
  NEO_COOLING_STARTED: '{{.COOLING_STARTED | default ""}}'
  NEO_COMPARISON_CAPTURE: '{{.CAPTURE | default ""}}'
  NEO_COMPARISON_RESUME: '{{.RESUME | default ""}}'
  NEO_COMPARISON_RETRY_INCOMPLETE: '{{.RETRY_INCOMPLETE | default "0"}}'

tasks:
  default:
    desc: List the shared project commands
    cmds: [task --list]

  doctor:
    desc: Check the Intel Linux build host and optional remote-access dependency
    cmds: [bash tools/doctor.sh]

  setup:
    desc: Prepare private workspace and pull/verify the locked Docker build environment
    cmds:
      - task: doctor
      - bash tools/run-logged.sh setup python3 tools/setup.py

  setup:host:
    desc: Install missing Debian/Ubuntu host packages with sudo (including Docker if absent)
    cmds: [bash tools/setup-host.sh]

  prepare:
    desc: Verify inputs and synchronize the locked Armbian source and project hooks
    cmds:
      - bash tools/run-logged.sh prepare python3 tools/prepare-build.py --bootloader "$NEO_BOOTLOADER" --radio-directory "$NEO_RADIO_DIR"

  provision:
    desc: Prepare stable private device identity and Wi-Fi using secrets in .env
    cmds:
      - python3 tools/provision.py --env .env --authorized-key "$NEO_AUTHORIZED_KEY" --output .local/provisioning/device

  build:
    desc: Run kernel regressions, build kernel, validate device tree, assemble and verify image (sequential)
    cmds:
      - task: doctor
      - task: test:nkmp
      - task: test:usb-lifecycle
      - task: test:usb-suspend
      - task: test:usb-phy-suspend
      - task: test:power-supply-suspend
      - task: test:axp223-gauge-status
      - task: test:axp-adc-width
      - task: test:brcmfmac-sleep
      - task: test:brcmfmac-freezer
      - task: test:brcmfmac-pm
      - task: test:brcmfmac-lifecycle
      - task: test:brcmfmac-irq
      - task: test:brcmfmac-worker
      - task: test:brcmfmac-regulatory
      - task: test:brcmfmac-tx-suspend
      - task: test:brcmfmac-band-queries
      - task: test:wake-irqs
      - task: test:power-irq-mask
      - task: test:sunxi-sdio-refs
      - task: test:musb-context
      - task: test:musb-sleep
      - task: test:udc-trace
      - task: test:usb-policy
      - task: test:clock-ranges
      - task: build:kernel
      - task: test:usb-policy-board
      - task: check:dt
      - task: build:image

  build:kernel:
    desc: Compile the locked kernel and modules; preserve incremental build outputs
    cmds: [bash tools/run-logged.sh kernel tools/build-kernel.sh]

  build:perf:
    desc: Cross-build optional ARM perf from the locked Linux source; no image or device change
    cmds: [bash tools/run-logged.sh perf bash tools/build-perf.sh]

  build:image:
    desc: Rebuild and verify userspace/image using the completed kernel stage
    cmds:
      - task: prepare
      - bash tools/run-logged.sh image tools/build-image.sh

  build:rootfs:
    desc: Bootstrap the signed Debian rootfs separately
    cmds:
      - task: prepare
      - bash tools/run-logged.sh rootfs tools/build-image.sh rootfs

  kernel:reset:
    desc: Archive only kernel scratch/output state before a changed patch queue
    cmds: [bash tools/run-logged.sh kernel-reset bash tools/reset-kernel.sh]

  build:prune-driver-scratch:
    desc: Preview superseded driver compiler trees for SUITE and optional TARGET; APPLY=1 removes them under the suite lock
    cmds: [python3 tools/prune-driver-scratch.py]

  build:compact-driver-sources:
    desc: Verify/share driver sources; SUITE, optional TARGET and RECORDED_PATCHES=1 for historical exports; APPLY=1 replaces copies
    cmds: [python3 tools/compact-driver-sources.py]

  check:kernel-source-reuse:
    desc: Cross-build two isolated ARM configurations using one read-only kernel source
    cmds: [bash tools/run-logged.sh kernel-source-reuse python3 tools/check-kernel-source-reuse.py]

  build:prune-retained:
    desc: Preview old raw images/kernel snapshots; KEEP=3, APPLY=1 verifies recovery and removes old copies
    cmds: [python3 tools/prune-retained.py]

  image:checkpoint:
    desc: Verify and retain completed image/kernel/transfer metadata before a new build; NAME required
    cmds: [bash tools/run-logged.sh checkpoint python3 tools/checkpoint-image.py]

  check:
    desc: Run host regression tests and shell lint; no device access
    cmds:
      - task: test
      - task: lint

  test:
    desc: Run runtime/tool regressions and the compiled AXP current-selector tests
    cmds:
      - python3 -m unittest discover -s runtime/tests -v
      - python3 -m unittest discover -s tools/tests -v
      - mkdir -p .local/build
      - cc -std=c11 -Wall -Wextra -Werror -Ikernel/overlay/drivers/power/supply kernel/tests/current_limit_test.c -o .local/build/current_limit_test
      - .local/build/current_limit_test
      - cc -std=c11 -Wall -Wextra -Werror -DNEO_MAC_GUARD_TEST tools/macos-mount-guard.c -o .local/build/mac-mount-guard-test
      - .local/build/mac-mount-guard-test

  lint:
    desc: Check Bash syntax and ShellCheck (system install or pinned builder cache)
    cmds: [bash tools/lint.sh]

  test:governor-recovery:
    desc: Verify rollback through user-systemd with temporary files; no device access or sudo
    cmds: [NEO_SYSTEMD_TESTS=1 python3 -m unittest discover -s tools/tests -p test_governor_compare.py -v]

  test:nkmp:
    desc: Compare locked original/patched clock searches natively and on ARM32 in the pinned builder
    cmds: [bash tools/run-logged.sh nkmp python3 tools/check-nkmp.py]

  test:usb-lifecycle:
    desc: Exercise actual AXP USB probe/IRQ/poll ownership and unwind with host shims; no device access
    cmds: [bash tools/run-logged.sh usb-lifecycle python3 tools/check-usb-lifecycle.py]

  check:usb-driver:
    desc: Run USB lifetime regressions and cross-compile the driver in isolated kernel scratch
    cmds: [bash tools/run-logged.sh usb-driver python3 tools/check-usb-lifecycle.py --compile-driver]

  test:usb-policy:
    desc: Test actual opt-in USB policy, topology, errors, races and probe cleanup natively and on ARM32
    cmds: [bash tools/run-logged.sh usb-policy python3 tools/check-usb-policy.py]

  test:usb-suspend:
    desc: Test actual AXP PM/IRQ work draining, wake errors and unwind natively and on ARM32
    cmds: [bash tools/run-logged.sh usb-suspend python3 tools/check-usb-suspend.py]

  test:musb-context:
    desc: Check actual MUSB context register behavior with and without the Sunxi quirk
    cmds: [bash tools/run-logged.sh musb-context python3 tools/check-musb-context.py]

  check:musb-drivers:
    desc: Run context regressions and compile the full ARM MUSB core and Sunxi drivers
    cmds: [bash tools/run-logged.sh musb-drivers python3 tools/check-musb-context.py --compile-drivers]

  test:udc-trace:
    desc: Execute actual USB endpoint trace formatting natively and on ARM32, with negative controls
    cmds: [bash tools/run-logged.sh udc-trace python3 tools/check-udc-trace.py]

  test:musb-sleep:
    desc: Test actual MUSB system-sleep connection ownership on native and ARM32
    cmds: [bash tools/run-logged.sh musb-sleep python3 tools/check-musb-sleep.py]

  check:musb-sleep-configs:
    desc: Check sleep/disconnect and callback regressions plus six isolated ARM configurations
    cmds: [bash tools/run-logged.sh musb-sleep-configs python3 tools/check-musb-sleep.py --compile-matrix]

  check:musb-sleep-drivers:
    desc: Test MUSB sleep ownership and compile the complete ARM controller/gadget/glue
    cmds: [bash tools/run-logged.sh musb-sleep-drivers python3 tools/check-musb-sleep.py --compile-drivers]

  check:udc-driver:
    desc: Run trace-format regressions and compile the complete ARM USB device-controller core
    cmds: [bash tools/run-logged.sh udc-driver python3 tools/check-udc-trace.py --compile-driver]

  check:usb-suspend-driver:
    desc: Run AXP suspend regressions and compile the complete ARM driver in isolated scratch
    cmds: [bash tools/run-logged.sh usb-suspend-driver python3 tools/check-usb-suspend.py --compile-driver]

  test:usb-phy-suspend:
    desc: Check actual Sun4i PHY scan, IRQ, notifier and suspend callbacks natively and on ARM32
    cmds: [bash tools/run-logged.sh usb-phy-suspend python3 tools/check-usb-phy-suspend.py]

  check:usb-phy-driver:
    desc: Run PHY suspend regressions and compile the complete ARM driver in isolated scratch
    cmds: [bash tools/run-logged.sh usb-phy-driver python3 tools/check-usb-phy-suspend.py --compile-driver]

  test:power-supply-suspend:
    desc: Check actual power-supply notification functions across freeze and thaw, native and ARM32
    cmds: [bash tools/run-logged.sh power-supply-suspend python3 tools/check-power-supply-suspend.py]

  test:axp223-gauge-status:
    desc: Check actual AXP223 volatility and regmap cache read decisions, native and ARM32
    cmds: [bash tools/run-logged.sh axp223-gauge-status python3 tools/check-axp223-gauge-status.py]

  check:axp223-gauge-driver:
    desc: Run gauge-status regressions and compile the complete ARM MFD driver
    cmds: [bash tools/run-logged.sh axp223-gauge-driver python3 tools/check-axp223-gauge-status.py --compile-driver]

  test:axp-adc-width:
    desc: Exhaustively check actual AXP ADC width decoding and IIO callers, native and ARM32
    cmds: [bash tools/run-logged.sh axp-adc-width python3 tools/check-axp-adc-width.py]

  check:axp-adc-drivers:
    desc: Run ADC width regressions and compile ARM ADC/USB users including the no-IIO fallback
    cmds: [bash tools/run-logged.sh axp-adc-drivers python3 tools/check-axp-adc-width.py --compile-driver]

  test:power-supply-lifetime:
    desc: Reproduce deferred notification teardown with original and test-only reordered core functions; native and ARM32
    cmds: [bash tools/run-logged.sh power-supply-lifetime python3 tools/check-power-supply-lifetime.py]

  check:power-supply-driver:
    desc: Run notification freeze/replay regressions and compile the complete ARM power-supply core
    cmds: [bash tools/run-logged.sh power-supply-driver python3 tools/check-power-supply-suspend.py --compile-driver]

  test:brcmfmac-sleep:
    desc: Check actual Wi-Fi sleep/clock helpers with SDIO failures, native and ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-sleep python3 tools/check-brcmfmac-sleep.py]

  test:wake-irqs:
    desc: Check actual IRQ-core/regmap/PEK/RTC/AC wake ownership and failures, native and ARM32
    cmds: [bash tools/run-logged.sh wake-irqs python3 tools/check-wake-irqs.py]

  test:power-irq-mask:
    desc: Reproduce masked AXP223 edge loss with actual regmap functions; native and ARM32, no hardware access
    cmds: [bash tools/run-logged.sh power-irq-mask python3 tools/check-power-irq-mask.py]

  test:power-key-events:
    desc: Reproduce PEK/input-core synthetic release and duplicate filtering, native and ARM32; no hardware
    cmds: [bash tools/run-logged.sh power-key-events python3 tools/check-power-key-events.py]

  test:sunxi-sdio-refs:
    desc: Check actual Sunxi/MMC SDIO reference ownership and resume rearm, native and ARM32
    cmds: [bash tools/run-logged.sh sunxi-sdio-refs python3 tools/check-sunxi-sdio-refs.py]

  check:sunxi-sdio-driver:
    desc: Run SDIO ownership regressions and compile complete host/core ARM objects in isolated scratch
    cmds: [bash tools/run-logged.sh sunxi-sdio-driver python3 tools/check-sunxi-sdio-refs.py --compile-driver]

  check:sdio-ref-history:
    desc: Compare explicit saved PM result.json files from one boot; optional --require-stable; no device access
    cmds: [python3 tools/check-sdio-ref-history.py]

  check:wake-drivers:
    desc: Run wake ownership regressions and compile all four complete ARM drivers in isolated scratch
    cmds: [bash tools/run-logged.sh wake-drivers python3 tools/check-wake-irqs.py --compile-drivers]

  check:brcmfmac-driver:
    desc: Run Wi-Fi sleep/clock regressions and compile the complete ARM SDIO driver in isolated scratch
    cmds: [bash tools/run-logged.sh brcmfmac-driver python3 tools/check-brcmfmac-sleep.py --compile-driver]

  test:brcmfmac-freezer:
    desc: Check actual Wi-Fi freezer, workers and PM callbacks with controlled concurrency, native and ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-freezer python3 tools/check-brcmfmac-freezer.py]

  test:brcmfmac-regulatory:
    desc: Check actual regulatory/PM callbacks, deferred country requests and replay errors on native/ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-regulatory python3 tools/check-brcmfmac-regulatory.py]

  check:brcmfmac-regulatory-driver:
    desc: Run regulatory regressions and compile the complete patched ARM cfg80211 object in scratch
    cmds: [bash tools/run-logged.sh brcmfmac-regulatory-driver python3 tools/check-brcmfmac-regulatory.py --compile-driver]

  test:brcmfmac-tx-suspend:
    desc: Check actual Wi-Fi queue/PM ownership and concurrent transmit drain natively and on ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-tx-suspend python3 tools/check-brcmfmac-tx-suspend.py]

  check:brcmfmac-tx-suspend-driver:
    desc: Run transmit admission regressions and compile complete ARM core/cfg80211 objects
    cmds: [bash tools/run-logged.sh brcmfmac-tx-suspend-driver python3 tools/check-brcmfmac-tx-suspend.py --compile-driver]

  test:brcmfmac-band-queries:
    desc: Check actual Wi-Fi band queries, transport errors and legacy fallbacks natively and on ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-band-queries python3 tools/check-brcmfmac-band-queries.py]

  check:brcmfmac-band-query-driver:
    desc: Run capability-query regressions and compile the complete ARM cfg80211 object
    cmds: [bash tools/run-logged.sh brcmfmac-band-query-driver python3 tools/check-brcmfmac-band-queries.py --compile-driver]

  check:brcmfmac-freezer-drivers:
    desc: Run Wi-Fi freezer regressions and compile both complete ARM SDIO objects in isolated scratch
    cmds: [bash tools/run-logged.sh brcmfmac-freezer-drivers python3 tools/check-brcmfmac-freezer.py --compile-driver]

  test:brcmfmac-pm:
    desc: Check actual Wi-Fi PM rollback, failed-wake I/O gates and control requests, native and ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-pm python3 tools/check-brcmfmac-pm.py]

  check:brcmfmac-pm-drivers:
    desc: Run Wi-Fi PM fault regressions and compile the full ARM driver in normal and debug configurations
    cmds: [bash tools/run-logged.sh brcmfmac-pm-drivers python3 tools/check-brcmfmac-pm.py --compile-driver]

  test:brcmfmac-lifecycle:
    desc: Check SDIO PM/reset/removal exclusion and sleeping IRQ deferral, native and ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-lifecycle python3 tools/check-brcmfmac-pm.py --lifecycle]

  check:brcmfmac-lifecycle-drivers:
    desc: Run SDIO lifecycle regressions and compile the full ARM driver in normal and debug configurations
    cmds: [bash tools/run-logged.sh brcmfmac-lifecycle-drivers python3 tools/check-brcmfmac-pm.py --lifecycle --compile-driver]

  test:brcmfmac-irq:
    desc: Exercise actual deferred Wi-Fi status/DPC service and error boundaries, native and ARM32
    cmds: [bash tools/run-logged.sh brcmfmac-irq python3 tools/check-brcmfmac-pm.py --irq-service]

  test:brcmfmac-worker:
    desc: Test Wi-Fi worker failure isolation, clock waits and control completion, native and ARM32
    cmds:
      - bash tools/run-logged.sh brcmfmac-worker python3 tools/check-brcmfmac-pm.py --irq-service --worker-errors
      - bash tools/run-logged.sh brcmfmac-worker-lifecycle python3 tools/check-brcmfmac-pm.py --lifecycle --worker-errors

  check:brcmfmac-worker-drivers:
    desc: Test worker errors and compile the complete ARM driver in normal/debug configurations
    cmds: [bash tools/run-logged.sh brcmfmac-worker-drivers python3 tools/check-brcmfmac-pm.py --irq-service --worker-errors --compile-driver]

  check:usb-policy-driver:
    desc: Run USB policy regressions and compile the complete ARM driver in isolated scratch
    cmds: [bash tools/run-logged.sh usb-policy-driver python3 tools/check-usb-policy.py --compile-driver]

  test:usb-policy-board:
    desc: Exercise the actual policy against the compiled DTB and rejected role/connector mutations
    cmds: [bash tools/run-logged.sh usb-policy-board python3 tools/check-usb-policy.py --dtb "$NEO_USB_POLICY_DTB"]

  test:clock-ranges:
    desc: Compare actual NM/NKM clock searches and constraints natively and on ARM32
    cmds: [bash tools/run-logged.sh clock-ranges python3 tools/check-clock-ranges.py]

  check:clock-drivers:
    desc: Run clock-range regressions and cross-compile complete clock objects in isolated scratch
    cmds: [bash tools/run-logged.sh clock-drivers python3 tools/check-clock-ranges.py --compile-driver]

  check:kernel:
    desc: Check resolved Kconfig and the completed kernel artifact manifest
    cmds:
      - python3 tools/check-kernel-config.py .local/build/kernel/.config
      - python3 tools/kernel-artifacts.py check

  check:dt:
    desc: Validate the project's bindings and built DTB in the pinned container
    cmds: [bash tools/run-logged.sh devicetree tools/check-devicetree.sh]

  image:verify:
    desc: Verify the current bundled image, or IMAGE=path, without writing it
    cmds: [python3 tools/pack-image.py verify]

  image:pack:
    desc: Compress and hash the current verified image for transfer to the Mac
    cmds: [python3 tools/pack-image.py pack]

  device:status:
    desc: Capture kernel, service, power and access status (ROUTE=wifi or usb)
    cmds: [python3 tools/remote.py device status]

  device:charge-inspect:
    desc: Read documented AXP223 charge/gauge inventory over USB; no control writes or sleep
    cmds: [python3 tools/check-charge-inventory.py]

  device:charge-baseline:
    desc: Read awake charging telemetry over USB for SECONDS=120; no control changes
    cmds: [python3 tools/check-charge-baseline.py]

  device:wifi-config:
    desc: Apply Wi-Fi credentials from .env over USB, verify Wi-Fi SSH, then update GAMESHELL_IP
    cmds:
      - task: provision
      - python3 tools/change-wifi.py

  device:wifi-scan-test:
    desc: Compare firmware/host/firmware scanning over USB; SECONDS=120 per phase, restore runtime flag
    cmds: [python3 tools/remote.py device wifi-scan-test --route usb]

  device:wifi-scan-restore:
    desc: Restore the saved runtime scan-offload flag over USB after an interrupted comparison
    cmds: [python3 tools/remote.py device wifi-scan-restore --route usb]

  device:wifi-firmware-test:
    desc: Try the pinned A0 firmware over USB for SECONDS=120, then restore original firmware
    cmds: [python3 tools/check-wifi-firmware.py]

  device:wifi-firmware-connected:
    desc: Verify candidate association, four Wi-Fi reconnections and original restoration over USB
    cmds: [python3 tools/check-wifi-firmware.py --connected]

  device:wifi-recovery:
    desc: Check installed firmware through four reconnections and unavailable/connected windows; USB required
    cmds: [python3 tools/check-wifi-firmware.py --installed]

  device:rsb-compare:
    desc: Compare 1000/candidate/1000 ms RSB delays over USB with independent restoration
    cmds: [python3 tools/check-rsb-runtime.py]

  device:rsb-restore:
    desc: Stop an interrupted RSB comparison and restore its saved delay over USB
    cmds: [python3 tools/check-rsb-runtime.py --restore]

  device:pm-inspect:
    desc: Read PM capabilities and RSB debug state over USB without entering suspend
    cmds: [python3 tools/check-pm-stages.py --inspect]

  device:keypad-inspect:
    desc: Save keypad identity, USB persistence, input paths and power state without changing policy
    cmds: [python3 tools/check-keypad.py]

  device:keypad-compare:
    desc: Three traced devices debug cycles with internal keypad persistence on/off/on; restore each phase
    cmds: [python3 tools/check-pm-stages.py --keypad-compare]

  device:keypad-retention:
    desc: Trace 1..4 devices debug cycles on the retention image; record supply and original-handle continuity
    cmds: [python3 tools/check-pm-stages.py --keypad-retention]

  device:keypad-quirks:
    desc: Compare baseline/candidate/baseline keypad port quirks; QUIRK=old-scheme/fast-recovery, CYCLES=1..4 per phase
    cmds: [python3 tools/check-pm-stages.py --keypad-quirks]

  device:keypad-input:
    desc: One owner-assisted retained-keypad driver test with on-screen tap/hold/release prompts
    cmds: [python3 tools/check-pm-stages.py --keypad-input]

  device:audio-inspect:
    desc: Save speaker card, mixer, amplifier and PCM state without changing controls
    cmds: [python3 tools/check-audio.py --inspect]

  device:audio-test:
    desc: Three bounded one-second speaker warnings at the owner-heard level; owner listens
    cmds: [python3 tools/check-audio.py --test]

  device:audio-path:
    desc: One one-second speaker tone with active PCM/amplifier/GPIO observations; LEVEL=3/4/5 (default 5), owner listens
    cmds: [python3 tools/check-audio.py --path-test]

  device:reboot:
    desc: Play three GameShell speaker warning tones, restore audio, then queue one reboot; ROUTE=usb/wifi
    cmds: [python3 tools/check-audio.py --reboot]

  device:audio-collect:
    desc: Retrieve a saved speaker test result; RUN required
    cmds: [python3 tools/check-audio.py --collect]

  device:audio-restore:
    desc: Stop a speaker test and restore its owned mixer controls
    cmds: [python3 tools/check-audio.py --restore]

  device:pm-test:
    desc: Manual freezer/devices debug stage only; owner present, USB powered, explicit STAGE required
    cmds: [python3 tools/check-pm-stages.py --test]

  device:wifi-trace-smoke:
    desc: One awake Wi-Fi reconnect with bounded metadata capture; USB required, logging restored
    cmds: [python3 tools/check-pm-stages.py --wifi-smoke]

  device:usb-trace-sample:
    desc: Passive ten-second USB/ECM metadata capture; no link or PM changes, restores logging
    cmds: [python3 tools/check-usb-trace.py]

  device:usb-trace-collect:
    desc: Read original USB metadata RUN over ROUTE=usb (default) or wifi; never resubmit
    cmds: [python3 tools/check-usb-trace.py --collect]

  device:rtc-inspect:
    desc: Read RTC time, logical alarm and controller identity; no clock or alarm change
    cmds: [python3 tools/check-rtc-alarm.py]

  device:rtc-restore:
    desc: Restore a saved same-boot RTC alarm after an interrupted awake check
    cmds: [python3 tools/check-rtc-alarm.py --restore]

  device:rtc-smoke:
    desc: Own a ten-second RTC alarm while awake, verify interrupt delivery and restore disabled alarm
    cmds: [python3 tools/check-rtc-alarm.py --smoke]

  device:power-key-inspect:
    desc: Read the AXP power-key identity and unresolved ownership marker; no PM or key grab
    cmds: [python3 tools/check-power-key.py]

  device:power-key-smoke:
    desc: Verify inhibitor and exclusive power-key ownership while awake; leave power key untouched
    cmds: [python3 tools/check-power-key.py --smoke]

  device:power-policy-inspect:
    desc: Read effective logind power-key policy and retained diagnostic ownership
    cmds: [python3 tools/check-power-key-policy.py]

  device:power-policy-smoke:
    desc: Awake untouched-key policy/worker-death/restoration check; no sleep
    cmds: [python3 tools/check-power-key-policy.py --smoke]

  device:power-key-input:
    desc: Attended awake power-key taps/short hold with speaker cues; explicit owner readiness required
    cmds: [python3 tools/check-power-key-policy.py --input]

  device:power-policy-collect:
    desc: Retrieve the original power-policy result after uncertain SSH; RUN required
    env:
      NEO_POLICY_RUN: '{{.RUN | default ""}}'
    cmds: [python3 tools/check-power-key-policy.py --collect]

  device:pm-platform:
    desc: One attended late/noirq debug cycle; checked image, same-boot RTC smoke, power-key ownership and traces required
    cmds: [python3 tools/check-pm-stages.py --platform]

  device:sleep-rehearse:
    desc: Awake RTC deadline/key-policy/trace rehearsal; QUALIFICATION required, no sleep submission
    cmds: [python3 tools/check-sleep-rtc.py --rehearse]

  device:sleep-battery-rehearse:
    desc: Awake battery-only RTC rehearsal over Wi-Fi; USB physically absent, QUALIFICATION/UNPLUGGED required
    cmds: [python3 tools/check-sleep-rtc.py --rehearse --connection battery]

  device:sleep-battery:
    desc: One attended battery-only RTC-wake attempt over Wi-Fi; USB absent, QUALIFICATION/REHEARSAL/UNPLUGGED/ATTENDED required
    cmds: [python3 tools/check-sleep-rtc.py --rtc-wake --connection battery]

  report:sleep-cable:
    desc: Bind observer action/display report to immutable cable-sleep result; RESULT/OBSERVATION/DISPLAY required, offline only
    cmds: [python3 tools/report-sleep-cable.py]

  report:journal-volume:
    desc: Summarize a private journalctl JSON-lines capture supplied after --; no message text or device access
    cmds: [python3 tools/report-journal-volume.py]

  device:sleep-cable-remove-rehearse:
    desc: Awake rehearsal for USB removal scenario; USB connected, QUALIFICATION/CABLE_ACTION required
    cmds: [python3 tools/check-sleep-rtc.py --rehearse --connection usb-remove]

  device:sleep-cable-batch-start:
    desc: Start four alternating cable sleeps; runs first rehearsal/sleep only, QUALIFICATION/ATTENDED/CABLE_ACTION required
    cmds: [python3 tools/check-sleep-cable-batch.py --start]

  device:sleep-cable-batch-next:
    desc: Run the next cable rehearsal/sleep after accepted observation; BATCH/ATTENDED/CABLE_ACTION required
    cmds: [python3 tools/check-sleep-cable-batch.py --next]

  report:sleep-cable-batch:
    desc: Record the pending cycle's owner observation; BATCH/OBSERVATION/DISPLAY required, no device action
    cmds: [python3 tools/check-sleep-cable-batch.py --observe]

  report:sleep-cable-batch-status:
    desc: Read saved batch state without contacting the device; BATCH required
    cmds: [python3 tools/check-sleep-cable-batch.py --status]

  device:sleep-cable-remove:
    desc: One attended sleep with prompted USB removal; QUALIFICATION/REHEARSAL/CABLE_ACTION/ATTENDED required
    cmds: [python3 tools/check-sleep-rtc.py --rtc-wake --connection usb-remove]

  device:sleep-cable-attach-rehearse:
    desc: Awake rehearsal for USB attachment scenario; USB absent, QUALIFICATION/CABLE_ACTION/UNPLUGGED required
    cmds: [python3 tools/check-sleep-rtc.py --rehearse --connection usb-attach]

  device:sleep-cable-attach:
    desc: One attended sleep with prompted USB attachment; QUALIFICATION/REHEARSAL/CABLE_ACTION/UNPLUGGED/ATTENDED required
    cmds: [python3 tools/check-sleep-rtc.py --rtc-wake --connection usb-attach]

  device:sleep-rtc:
    desc: One attended real s2idle attempt; QUALIFICATION, REHEARSAL and fresh ATTENDED=1 required
    cmds: [python3 tools/check-sleep-rtc.py --rtc-wake]

  device:sleep-batch:
    desc: One to four attended RTC-wake cycles; stop on incomplete recovery, retain original run
    env:
      NEO_PM_CYCLES: '{{.CYCLES | default "4"}}'
    cmds: [python3 tools/check-sleep-rtc.py --rtc-batch]

  device:sleep-collect:
    desc: Read original sleep RUN and live recovery state; ROUTE=usb (default) or wifi, never resubmit
    cmds: [python3 tools/check-sleep-rtc.py --collect]

  report:sleep-evidence:
    desc: Offline RTC/trace/clock assessment of saved RESULT; never requalifies or rewrites the original
    cmds: [python3 tools/report-sleep-evidence.py]

  device:sleep-connection-inspect:
    desc: Read cable/PHY/power/IRQ state without alarm or PM changes; ROUTE=usb (default) or wifi
    cmds: [python3 tools/check-sleep-rtc.py --connection-inspect]

  device:sleep-clock-inspect:
    desc: Read CPU-idle/timer state and sample bracketed clocks while awake; no RTC or PM changes
    cmds: [python3 tools/check-sleep-rtc.py --clock-inspect]

  device:pm-power-key:
    desc: Attended debug stage with exclusive power-key ownership; explicit STAGE and owner readiness required
    cmds: [python3 tools/check-pm-stages.py --test --power-key]

  device:pm-power-key-input:
    desc: Attended one-second POWER release during devices debug, then fresh awake tap; explicit readiness required
    cmds: [python3 tools/check-pm-stages.py --test --power-key-input]

  device:pm-collect:
    desc: Retrieve a PM stage's persistent device evidence after reconnection; RUN required
    cmds: [python3 tools/check-pm-stages.py --collect]

  device:pm-restore:
    desc: Stop a PM stage and restore its owned debug controls over USB
    cmds: [python3 tools/check-pm-stages.py --restore]

  device:wifi-visibility:
    desc: Compare cached scans with the .env SSID over USB without printing network names
    cmds: [python3 tools/check-wifi-visibility.py]

  mac:wifi:
    desc: Inspect the Mac Wi-Fi band and private SSID match without changing networks
    cmds: [python3 tools/check-mac-wifi.py]

  device:logs:
    desc: Collect and download a private diagnostic archive (ROUTE=wifi or usb)
    cmds: [python3 tools/remote.py device logs]

  device:journal-inspect:
    desc: Capture journal storage, service ownership and bounded kernel history over USB (read-only)
    cmds: [python3 tools/check-journal.py]

  device:journal-policy:
    desc: Install the saved persistent-journal policy over USB, preserving prior files as private evidence
    cmds: [python3 tools/check-journal.py --apply]

  device:journal-rotation:
    desc: Run ordinary text-log rotation and verify journald/history stay intact; requires the saved policy
    cmds: [python3 tools/check-journal.py --verify-rotation]

  device:check:
    desc: Check running image, services, journal ACLs, country and temporary BPF loopback policies
    cmds: [python3 tools/remote.py device check]

  device:exec:
    desc: Run an explicit device command, e.g. task device:exec -- uname -r
    cmds: [python3 tools/remote.py device exec]

  device:backlight:
    desc: Cycle visible brightness and three off/on transitions, then restore; watch the screen
    cmds: [python3 tools/remote.py device backlight]

  device:usb-reconnects:
    desc: Record CYCLES=4 cable removals on the board and verify USB SSH after each return
    cmds: [python3 tools/check-usb-reconnects.py]

  device:usb-rapid:
    desc: Record CYCLES=4 immediate unplug/replug checks with 20 ms sampling; wait for ready
    cmds: [python3 tools/check-usb-reconnects.py --rapid]

  device:usb-detect:
    desc: Capture detailed USB IRQ/state events over Wi-Fi; start unplugged, CYCLES=4 (0 for smoke)
    cmds: [python3 tools/check-usb-detection.py]

  device:usb-policy:
    desc: Verify running USB policy, or select MODE=stock/experimental for next boot (never reboots)
    cmds: [python3 tools/remote.py device usb-policy]

  device:usb-counts:
    desc: Count actual USB poll callbacks for SECONDS=60; diagnostics off again on exit
    cmds: [python3 tools/check-usb-diagnostics.py --mode count]

  device:usb-errors:
    desc: Inject ERRORS=1 (1..4) bounded poll-only read failures and verify retained state/retry
    cmds: [python3 tools/check-usb-diagnostics.py --mode errors]

  device:usb-diag-restore:
    desc: Stop a USB diagnostic test and restore its owned controls after an interruption
    cmds: [python3 tools/check-usb-diagnostics.py --restore]

  device:stability:
    desc: Check a temporary 128 MiB file and run five minutes of CPU/memory load; keep USB connected
    cmds: [python3 tools/remote.py device stability]

  device:qualify-awake:
    desc: Run bounded awake checks over USB with one private progress/report folder; keep Mac and Wi-Fi available
    cmds: [python3 tools/qualify-awake.py]

  device:qualify-awake-plan:
    desc: Show the fixed unattended awake sequence without connecting
    cmds: [python3 tools/qualify-awake.py --plan]

  report:awake:
    desc: Read awake qualification progress from CAPTURE=directory; no device access or automatic resume
    cmds: [python3 tools/qualify-awake.py --report "$NEO_COMPARISON_CAPTURE"]

  device:battery-check:
    desc: Simulate critical and invalid readings against the installed guard without shutting down
    cmds: [python3 tools/remote.py device battery-check]

  device:idle-sample:
    desc: Sample battery idle for SECONDS=600 with BACKLIGHT=keep or off; leave controls alone
    cmds: [python3 tools/remote.py device idle-sample]

  device:power-profile:
    desc: Profile awake CPU/interrupt/radio counters for SECONDS=120; USB unplugged, controls untouched
    cmds: [python3 tools/remote.py device power-profile]

  device:usb-idle-compare:
    desc: Run experimental/stock/experimental battery idle and counter windows, including two reboots
    cmds: [python3 tools/compare-usb-idle.py]

  report:usb-idle:
    desc: Summarize a completed comparison from CAPTURE=directory; no device access
    cmds: [python3 tools/report-usb-idle.py]

  device:governor-compare:
    desc: Compare original/slower/original schedutil rates, then restore; SECONDS=120 per phase, RATE_US=10000
    cmds: [python3 tools/remote.py device governor-compare]

  device:governor-profile:
    desc: Sample sugov kernel instructions with perf for SECONDS=30; USB unplugged, settings unchanged
    cmds: [python3 tools/remote.py device governor-profile]

  device:boot-cycles:
    desc: Observe CYCLES=4 physical power cycles; keep USB connected (CYCLES=0 captures current boot only)
    cmds: [python3 tools/check-boot-cycles.py]

  mac:status:
    desc: Show Mac connectivity and physical external disks without changing them
    cmds: [python3 tools/remote.py mac status]

  mac:usb-inspect:
    desc: Save read-only Mac USB/network and sleep history; no lease renewal or settings change
    cmds: [python3 tools/check-mac-usb.py]

  mac:stage:
    desc: Pack and upload the current verified image and flash helper; no disk write
    cmds:
      - task: image:pack
      - python3 tools/remote.py mac stage

  mac:stage-recovery:
    desc: Select a verified recovery checkpoint on the Mac; reuse its existing archive when present; NAME required
    cmds: [python3 tools/remote.py mac stage-recovery]

  mac:backup:
    desc: Read and verify the complete original card, copy archive to Linux, and eject
    requires:
      vars: [DISK]
    cmds: [python3 tools/remote.py mac backup]

  mac:inspect:
    desc: Record a fresh target identity after identifying the spare (DISK=diskN)
    requires:
      vars: [DISK]
    cmds: [python3 tools/remote.py mac inspect]

  mac:preflight:
    desc: Verify staged image and recorded card identity; no disk write
    cmds: [python3 tools/remote.py mac preflight]

  mac:flash:
    desc: ERASE the explicitly identified spare, verify all written bytes and eject
    requires:
      vars: [DISK]
    cmds: [python3 tools/remote.py mac flash]

  mac:compare:
    desc: Read-only full image/sector comparison after fresh mac:inspect; retain mismatch evidence
    requires:
      vars: [DISK]
    cmds: [python3 tools/remote.py mac compare]
