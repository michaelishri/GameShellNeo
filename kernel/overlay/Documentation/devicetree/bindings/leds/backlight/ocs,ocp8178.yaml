%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/ocs,ocp8178.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Orient Chip OCP8178 one-wire backlight controller
maintainers:
  - Michael Ishri <michael.ishri@gmail.com>
description: |
  A GPIO-controlled backlight with 31 nonzero brightness codes. Code zero
  requests shutdown; the driver holds CTRL low rather than leaving the
  boost converter enabled. GPIO must support non-sleeping access.
allOf:
  - $ref: common.yaml#
properties:
  compatible:
    const: ocs,ocp8178
  ctrl-gpios:
    maxItems: 1
  default-brightness:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 31
    default: 1
required:
  - compatible
  - ctrl-gpios
unevaluatedProperties: false
